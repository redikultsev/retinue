# The checks CONTRIBUTING.md lists, on every pull request and every push to main. Each step is the command a
# contributor runs by hand, so a red step here is the same red on a laptop.
# Actions are pinned by commit, each at least two weeks old when pinned (as face/pnpm-workspace.yaml holds packages).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # develop's runs end in a deploy, which is never cut off halfway: they queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  python:
    name: Python — pytest, ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # the whole suite, Docker builds included, took 23 min on a 2-core Linux box
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.6.12"        # the image's uv (Dockerfile)
          python-version: "3.12"   # the image's Python
          enable-cache: true
      # The runner has Docker, so the tests that need it run here too (the code path across two users, the open
      # proxy, the face's nginx config). The probes stay skipped here and run in the job below; the ones that need the
      # owner's token run on the server.
      # In one process per core (pytest-xdist): the tests share nothing another process could see — each writes only
      # under its own tmp_path, binds port 0, names its containers and networks with a random suffix, and changes the
      # environment through monkeypatch or a subprocess's own env (CONTRIBUTING.md, «Tests run in parallel»).
      - name: pytest
        run: uv run --frozen --with pytest --with pytest-xdist==3.8.0 pytest -q -n auto --durations=15
      - name: ruff
        run: uv run --with ruff ruff check .

  # The contract with the CLI: the probes, on the pinned binary against the fake API, in a container as on a laptop
  # (docs/platform.md, «Probes»). A skip is red here: RETINUE_PROBES_REQUIRED, tests/conftest.py.
  probes:
    name: Probes — the pinned CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pytest -m probe
        run: |
          docker run --rm -e RETINUE_PROBES_REQUIRED=1 -v "$PWD":/src:ro ghcr.io/astral-sh/uv:0.6.12-python3.12-bookworm-slim bash -c 'cp -r /src /w && cd /w \
            && apt-get update -qq && apt-get install -y -qq curl git bubblewrap socat >/dev/null \
            && bash deploy/lanes/fetch-cli.sh /cli && RETINUE_LANE_CLI=/cli/claude uv run --frozen --with pytest \
            pytest -q -m probe tests --ignore=tests/test_lane_container.py'

  face:
    name: Face — typecheck, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: face/package.json   # its packageManager pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: face/pnpm-lock.yaml
      - run: pnpm -C face install --frozen-lockfile
      - run: pnpm -C face typecheck
      - run: pnpm -C face lint
      - run: pnpm -C face test

  face-e2e:
    name: Face — in a browser (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: face/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: face/pnpm-lock.yaml
      - run: pnpm -C face install --frozen-lockfile
      - run: pnpm -C face exec playwright install --with-deps chromium
      - run: pnpm -C face e2e

  # A push to develop: its images are built once, here, as a release's are (release.yml, tagged sha-<12 hex>), while
  # the checks above run — the build needs none of them. Only once it passed every check does the server that follows
  # develop pull and start them (docs/install.md, «Following develop»): ssh with a key that can run only
  # deploy/deploy.sh, handed the commit. A commit that fails a check still has its images in the registry, and nothing
  # runs them. The key is in the environment `server`, which only develop may use; without its secrets the job says so
  # and stops (a fork).
  images:
    name: Images of this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ github.sha }}

  deploy:
    name: Deploy develop to the server
    needs: [python, probes, face, face-e2e, images]   # every check and the images; one red, and it never starts
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    environment: server
    timeout-minutes: 45
    steps:
      - name: Deploy this commit
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "no server to deploy to: the environment 'server' has no DEPLOY_KEY, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$HOST" "$SHA"
