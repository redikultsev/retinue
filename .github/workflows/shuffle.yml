# TEMPORARY (#79), removed before merge: the suite across processes in three random orders, to show no test leans on
# another having run before it in the same process.
name: Shuffle

on:
  pull_request:

permissions:
  contents: read

jobs:
  shuffle:
    name: pytest -n auto, random order, seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.6.12"
          python-version: "3.12"
          enable-cache: true
      - name: pytest
        run: >-
          uv run --frozen --with pytest --with pytest-xdist==3.8.0 --with pytest-randomly==5.0.0
          pytest -q -n auto --randomly-seed=${{ matrix.seed }} --durations=15
