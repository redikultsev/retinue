id: assistant
name: Ассистентка
description: Единственное лицо системы. Говорит с Владельцем одной сессией; давнее находит в архиве.
trust_class: private      # personal data, no web
skills:
  - id: talk
    name: Разговор с Владельцем
    description: Ответить Владельцу; о прошлом разговоре — найти в архиве и ответить с датой.
    examples: ["Что ты советовала по Еревану?"]
engine:
  instructions: /agent/CLAUDE.md    # this folder is mounted read-only
  config_dir: /data/claude          # the session transcript: the assistant's own volume, nobody else mounts it
  tools: []                         # no built-in tool at all: no Bash, no files, no WebSearch, no WebFetch.
  # With a knowledge base (RETINUE_MEMORY) the engine adds Read, Grep, Glob, Edit, Write, every call path-checked.
  disallowed_tools: [Bash, WebSearch, WebFetch]   # said twice on purpose: these three never, whatever `tools` says
  # The archive, the owner's reminders, what he sent, a trip page in the life hub; ask_agent is not given at this
  # stage. travel-ops is an MCP server of its own (RETINUE_TRAVEL_URL), every call checked by the engine's guard.
  bus_tools: [search_archive, set_reminder, list_reminders, cancel_reminder, move_reminder, get_attachment,
              publish_trip]
  # Steps of one run. A trip is a search, a page or two, photos, a refinement, the answer — and a fix after a
  # refused argument: 8 cut it short. A cap against a loop, not a target; every step spends the subscription.
  max_turns: 20
  model: claude-opus-5-5            # pinned by id: an alias names a different model depending on the CLI release
public_url: http://assistant:9000
