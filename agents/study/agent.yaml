id: study
name: Учёба
description: Учебные планы, конспекты и поиск учебных материалов. Видит только открытые конспекты.
trust_class: web          # web, no personal base: reads only L0 notes in its own workspace
skills:
  - id: study-chat
    name: Учёба
    description: Объяснить тему, составить план изучения, найти материалы, вести конспекты.
    examples: ["Составь план по RAG на 2 недели", "Объясни, как работает BM25"]
engine:
  # Edit(path) also governs Write; Claude Code ignores Write(path) rules.
  allowed_tools: ["Read(./**)", "Edit(./**)", "Glob", "Grep", "WebSearch", "WebFetch"]
  disallowed_tools: ["Bash", "Read(//proc/**)", "Read(//run/**)", "Read(//etc/**)", "Read(//root/**)", "Read(//home/**)"]
  max_turns: 40
workspace: /workspace
state_db: /data/agent.sqlite
public_url: http://agent-study:9000
