id: travel
name: Путешествия
description: Подбор авиа- и ЖД-билетов и отелей. Ищет и сравнивает, даёт ссылки; ничего не покупает.
trust_class: web          # web, no personal base: gets trip details only from the request
skills:
  - id: find-trip
    name: Подобрать поездку
    description: Найти перелёт, поезд или отель по заданному маршруту и датам, сравнить и дать ссылки на выдачу.
    examples: ["Белград → Ереван, 10–15 ноября, 1 взрослый, ручная кладь"]
engine:
  allowed_tools: ["Read(./**)", "Write(./**)", "Glob", "WebSearch", "WebFetch"]
  disallowed_tools: ["Bash", "Read(//proc/**)", "Read(//run/**)", "Read(//etc/**)", "Read(//root/**)", "Read(//home/**)"]
  max_turns: 40
workspace: /workspace
state_db: /data/agent.sqlite
public_url: http://agent-travel:9000
