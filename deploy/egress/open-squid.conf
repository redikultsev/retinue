# The open proxy: the room's only way out (lane-private-egress; the retired lane-web-egress reads the same files).
# Open, unlike the other proxies: CONNECT to port 443 of any host on the public internet — the room reads the web —
# and never to a place inside: a private, loopback, link-local or CGNAT address,
# this server's own public addresses, or the owner's own domains. TLS is not opened: the proxy sees the host name of a
# CONNECT request, resolves it and checks the addresses it got, so a public name that resolves to an inside address is
# refused as the address itself would be. The check and the connection use Squid's DNS cache, not one atomic lookup:
# a name rebound between them can still slip through, so everything inside keeps its own authentication anyway
# (docs/platform.md, «The room»).
http_port 3128

acl tls_port port 443
# Ours, replaced by setup.sh every run: the ranges no public host lives in.
acl inside dst "/etc/squid/deny-nets.txt"
# The operator's, written once (setup.sh fills it with the host's public addresses): this server from outside.
acl inside dst "/etc/squid/deny-ips.txt"
# The operator's, written once: the owner's own zones (`.example.com` is the zone and every name under it). By name
# only (-n): an address literal is never looked up in reverse, so this list costs no DNS and decides on names alone.
acl owners dstdomain -n "/etc/squid/deny-domains.txt"
# CONNECT is one of Squid's predefined ACLs (method CONNECT).

http_access deny !CONNECT              # no plain HTTP at all
http_access deny CONNECT !tls_port
http_access deny owners                # by name, before any lookup
http_access deny inside                # by the addresses the name resolved to
http_access allow CONNECT
http_access deny all

cache deny all
# A refused request is a line with TCP_DENIED; every tunnel is a line with the host it went to.
access_log stdio:/var/log/squid/access.log
