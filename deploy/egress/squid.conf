# The only way out of the `agents` network. An agent container has no route to the internet; its Claude Code
# reaches the model API through this proxy (HTTPS_PROXY), and the proxy lets through nothing else.
# TLS is not opened: the proxy sees the host name of a CONNECT request and nothing more.
http_port 3128

acl allowed dstdomain "/etc/squid/allowed-hosts.txt"
acl tls_port port 443
# CONNECT is one of Squid's predefined ACLs (method CONNECT).

http_access deny !CONNECT              # no plain HTTP at all
http_access deny CONNECT !tls_port
http_access allow CONNECT allowed
http_access deny all

cache deny all
# A refused request is a line with TCP_DENIED: that is how the list of hosts is found out, not guessed.
access_log stdio:/var/log/squid/access.log
