# The face: the app's files (face/dist, in the image) and /api/* passed to the platform's face API. Read-only: nginx
# writes only its pid and temporary files, to /tmp (tmpfs). Traefik lets through the owner's devices only and adds
# the key that /etc/nginx/face/key.conf checks (setup.sh renders it; root's, mounted read-only): a neighbour on
# dokploy-network that reaches this container directly does not have it and gets 404.
#
# The face API is the platform's own address on the internal network `face-platform` (compose: `ipv4_address`,
# the same as the platform's RETINUE_FACE_HOST). Who may do what is decided there alone; nothing here is secret.

# Hashed assets live for a year; everything that names them (index.html, sw.js, the manifest) is revalidated on every
# load, so a new deploy is seen at once. The face API sets its own (`no-store`): nothing added there.
map $uri $face_cache_control {
    ~^/assets/      "public, max-age=31536000, immutable";
    ~^/api/         "";
    default         "no-cache";
}

# A file a session handed over and the face shows in its frame (`/api/files/<id>/view`, docs/face.md «A session's files»): the
# app's policy and X-Frame-Options would forbid the frame, so neither is added there — the platform sends that
# response's own policy: `sandbox`, nothing loaded but inline styles and data: images, framed by the face alone. An
# empty value adds no header; a map, not a location's add_header, which would drop every other header.
map $uri $face_csp {
    ~^/api/files/[^/]+/view$    "";
    default                     "default-src 'self'; img-src 'self' data:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
}
map $uri $face_frame_options {
    ~^/api/files/[^/]+/view$    "";
    default                     "DENY";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/face;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    client_max_body_size 1m;

    include /etc/nginx/face/key.conf;

    # The policy face/README.md requires, word for word ($face_csp above). frame-ancestors 'none': the phones' Telegram opens a Mini
    # App in a web view, where this page is the top document; a page that frames it (web.telegram.org) is another
    # site, where the login cookie (SameSite=Strict) is never set or sent, so the app could not work there anyway.
    add_header Content-Security-Policy $face_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $face_frame_options always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), screen-wake-lock=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $face_cache_control always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # To the face API: the browser's own Cookie, Origin and X-Retinue (its CSRF checks); never Traefik's key.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Retinue $http_x_retinue;
    proxy_set_header X-Face-Key "";

    location /api/ {
        proxy_pass http://172.16.96.10:9600;
        proxy_read_timeout 60s;
    }

    # The owner's message into a session, or a new one, with its attachments (retinue/inbox.py: 30 MB of files in
    # base64, and the rest): streamed to the platform as it comes, never spooled to this container's small /tmp; the
    # platform reads every picture before it answers.
    location ~ "^/api/sessions(/[0-9a-f]{8}/input)?$" {
        client_max_body_size 44m;
        proxy_request_buffering off;
        proxy_pass http://172.16.96.10:9600;
        proxy_read_timeout 300s;
    }

    # The owner's voice (retinue/face.py `speech`): a recording of up to 10 minutes, 20 MB at most, streamed to the
    # platform as it comes, never spooled here; answered when ElevenLabs has transcribed it.
    location = /api/speech {
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_pass http://172.16.96.10:9600;
        proxy_read_timeout 300s;
    }

    # The stream: every event as it is written, for as long as the app keeps it open (a ping every 15 s).
    location = /api/events {
        proxy_pass http://172.16.96.10:9600;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location ~ /\. { return 404; }

    location /assets/ { try_files $uri =404; }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The app's routes are the app: /, /login, the tabs (/today, /sessions, /new, /spaces…, /pages, /week; /read, its old name), /s/<id>, /a/<id>,
    # /f/<id>, /b/<id>, /p/<id>. Anything else that is not a file is 404.
    location ~ ^/(|login|today|sessions|new|pages|read|week|spaces|spaces/[^/]+|spaces/[^/]+/r/.+|s/[^/]+|a/[^/]+|f/[^/]+|b/[^/]+|p/[^/]+)$ { try_files /index.html =404; }

    location / { try_files $uri =404; }
}

# The healthcheck's own port: loopback only, no key, nothing but 204.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz { return 204; }
    location / { return 404; }
}
