# The public sites (docs/pages.md, «Sharing»): only the files the pages service wrote for the pages the owner shared,
# one folder per site under /public/<host>, read-only. No key, no store, no API: what reaches this container from the
# internet is static files. Traefik routes only the configured sites here (PAGES_PUBLIC_RULE), at a pace.
#
#   /                 the site's home page's shell        s/_home.html
#   /<id>             a shared page's shell                s/<id>.html
#   /raw/<id|_home>   the page itself, in the shell's frame: r/<id>.html (no script), r/scripts/<id>.html (scripts)
#   /_pages/          the shell's script and style
#   /pages/_vendor/   what pages may load (highlight.js, mermaid, fonts), with CORS: a sandboxed page's origin is opaque
#
# Every location sets all its headers itself, `always` — on a 403 and a 404 too: a response under /raw/ without its
# sandbox would be a document of the site's origin.

map $host $pages_site {
    ~^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$  $host;
    default                                                              "";
}

server {
    listen 8080 default_server;
    server_name _;
    charset utf-8;
    server_tokens off;
    autoindex off;
    root /public/$pages_site;

    if ($pages_site = "") { return 404; }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    location = / { try_files /s/_home.html =404; }
    location ~ "^/(?<page>[a-z0-9][a-z0-9-]{0,63})$" { try_files /s/$page.html =404; }
    location ^~ /_pages/ { try_files $uri =404; }

    location ^~ /pages/_vendor/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page, only in its shell's frame on this site: a frame of this origin loading it, never a page that points
    # its own frame here (that request is cross-site to the browser) and never a window of its own.
    location ~ "^/raw/(?<slug>_home|[a-z0-9][a-z0-9-]{0,63})$" {
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        if ($http_sec_fetch_dest != "iframe") { return 403; }
        if ($http_sec_fetch_site != "same-origin") { return 403; }
        if (-f $document_root/r/scripts/$slug.html) { rewrite ^ /r/scripts/$slug.html last; }
        rewrite ^ /r/$slug.html last;
    }
    location ^~ /r/scripts/ {
        internal;
        add_header Content-Security-Policy "default-src 'none'; script-src https://$host/pages/_vendor/ 'unsafe-inline'; style-src https://$host/pages/_vendor/ 'unsafe-inline'; img-src https://$host/pages/_vendor/ data:; font-src https://$host/pages/_vendor/ data:; connect-src 'none'; worker-src 'none'; frame-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://$host; sandbox allow-scripts allow-forms allow-modals" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ^~ /r/ {
        internal;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src https://$host/pages/_vendor/ 'unsafe-inline'; img-src https://$host/pages/_vendor/ data:; font-src https://$host/pages/_vendor/ data:; connect-src 'none'; worker-src 'none'; frame-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://$host; sandbox allow-popups allow-popups-to-escape-sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { return 404; }
}

# The healthcheck's own port: loopback only, nothing but 204.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz { return 204; }
}
