[project]
name = "retinue"
version = "0.1.0"
description = "A private retinue of AI agents: specialists that work together in your Matrix, while your secrets stay home."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2,<1.3",
    "claude-agent-sdk>=0.2.163,<0.3",
    "mautrix>=0.21,<0.22",
    "commonmark>=0.9",
    "pyyaml>=6",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
retinue-router = "retinue.router:main"
retinue-agent = "retinue.agent_host:main"
retinue-admin = "retinue.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
