[project]
name = "retinue"
version = "0.1.0"
description = "A personal AI platform on your own server: an assistant that cannot leak, and Claude Code sessions you approve from your phone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2,<1.3",
    "claude-agent-sdk==0.2.163",   # exact: the wheel carries its own `claude` CLI (2.1.286)
    "aiohttp>=3.9",                # the bus server; used to arrive only through mautrix
    "mautrix>=0.21,<0.22",
    "markdown-it-py>=3",
    "pyyaml>=6",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata>=2024.1",              # zoneinfo data: the slim image may have no /usr/share/zoneinfo
    "pillow>=11",                  # photos: upright, at most 1568 px, JPEG — before the model sees them
    "pillow-heif>=1",              # HEIC/HEIF: what an iPhone sends when a photo goes as a file
    "pypdf>=5",                    # PDF: pages, password, text layer — checked before the model gets the file
    "cryptography>=42",            # pypdf opens AES-locked PDFs through it; came only through other packages
    "python-docx>=1.1",            # the text of office files; markitdown would bring numpy, onnxruntime, pandas
    "openpyxl>=3.1",
    "python-pptx>=1",
    "defusedxml>=0.7",             # openpyxl parses through it when it is installed: no entity expansion
    "airportsdata>=20260905",      # travel: an airport code in a search must be a real one (3 MB of CSV)
]

[project.scripts]
retinue-router = "retinue.router:main"
retinue-agent = "retinue.agent_host:main"
retinue-admin = "retinue.admin:main"
retinue-collector = "retinue.collector:main"
retinue-mail-send = "retinue.sender:main"
retinue-tg-business = "retinue.tgbusiness:main"
retinue-lane = "retinue.lane_host:main"
retinue-platform = "retinue.platformd:main"
retinue-pages = "retinue.pagesd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["probe: runs the pinned lane CLI (skipped without it)"]

[tool.ruff]
# A dev check, not a formatter: `uv run --with ruff ruff check .`. The rules are those the code already keeps —
# pyflakes and pycodestyle's errors; the line length is the code's own, and long lines are not flagged.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # a fixture imported from another test module and named as a parameter
